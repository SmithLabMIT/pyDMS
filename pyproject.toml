[build-system]
requires = ["setuptools>=77.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pyDMS"
version = "0.1.0"
description = "dual-mode sorption (DMS) model fitting and analysis"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Brandon C. Tapia"},
  { name = "Pablo A. Dean" },
  { name = "Jing Ying Yeo" },
  { name = "Albert X. Wu" },
  { name = "Zachary P. Smith", email = "smithlab_software@gmit.edu" }
]

dependencies = [
  "numpy",
  "matplotlib",
  "Pillow",
  "reportlab",
  "scipy",
  "statsmodels",
  "scikit-learn"]

keywords = ["sorption", "membranes", "gas separation", "polymer modeling"]

classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Chemistry",
  "Topic :: Scientific/Engineering :: Physics"]


[project.optional-dependencies]
dev = ["pytest", "black", "build", "twine"]
docs = ["sphinx", "sphinxcontrib-bibtex", "sphinx_copybutton",]

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
"pyDMS.images" = ["*.png"]

[tool.setuptools.packages.find]
where = ["."
]
[tool.black]
target-version = ["py312"]
line-length = 100
skip-magic-trailing-comma = true
exclude = '''
/(
    examples
)/
'''
